name: expen
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.1+1
environment:
  sdk: ^3.7.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.0.0
  equatable: ^2.0.7
  flutter_material_pickers: ^3.7.0
  provider: ^6.1.2
  shared_preferences: ^2.5.2
  url_launcher: ^6.3.1
  package_info_plus: ^9.0.0
  fl_chart: ^1.1.1
  flutter_launcher_icons: ^0.14.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  intl: ^0.19.0
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  flutter_local_notifications: ^21.0.0
  permission_handler: ^12.0.1
  flutter_sms_inbox: ^1.0.4
  pdf: ^3.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#FFFFFF"
  remove_alpha_ios: true
  
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/logo.png
